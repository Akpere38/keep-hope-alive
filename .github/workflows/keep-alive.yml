name: Keep Webapps and Supabase Projects Alive

on:
  schedule:
    # Runs every day at 07:17 UTC (less congested minute).
    - cron: "17 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run keep-alive script
        env:
          SUPABASE_ANON_KEY_KAJPURPJXWWZIRIQQAHS: ${{ secrets.SUPABASE_ANON_KEY_KAJPURPJXWWZIRIQQAHS }}
          SUPABASE_ANON_KEY_TJOVZBTDJJEQZDIOTAET: ${{ secrets.SUPABASE_ANON_KEY_TJOVZBTDJJEQZDIOTAET }}
          SUPABASE_ANON_KEY_PFKAOSXHNMPEJPQPTRFA: ${{ secrets.SUPABASE_ANON_KEY_PFKAOSXHNMPEJPQPTRFA }}
        run: python ping_services.py

